<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign up</title>
</head>
<body>


<img src="images/PetFolio_background.png" alt="" class="back">


    <div class="signup-box">
        <form>
    <h2>Sign up</h2>
    <input type="text" placeholder="Username"><br><br>
    <input type="email" placeholder="Email"><br><br>

    <div class="password-box">
    <input type="password" id="password" placeholder="Password">
    <br><br>
    <input type="text" placeholder="City"><br><br>
    <input type="text" placeholder="District"><br><br>
    
</div>
<br><br>
<div class="remember">
            <label>
            <input type="checkbox" id="checkbox">Remember
            </label>
        </div>
    
<div class="buttons">
       
    <button type="reset" class="reset">Reset</button>
    <button type="submit" class="submit">Sign up</button>
        </div>
        
</form>
    <img src="images/kopkeeee.png" alt="" class="dog">
    <img src="images/kedoo.png" alt="" class="cat">


</div>
</body>
</html>
